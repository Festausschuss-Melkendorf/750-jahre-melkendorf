name: Integrate website news notice
on:
  push:
    paths:
      - '.github/workflows/integrate-site-notice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add notice script to large homepage safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          content = p.read_text(encoding='utf-8')
          tag = '<script src="/site-updates.js" defer></script>'
          if tag in content:
              print('Announcement script is already linked.')
          else:
              if content.count('</body>') != 1:
                  raise RuntimeError('Unexpected homepage HTML; refusing to modify it')
              p.write_text(content.replace('</body>', tag + '\n</body>'), encoding='utf-8')
              print('Homepage updated without touching embedded assets.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Link one-time Dorfarchiv update notice on homepage"
            git push
          else
            echo "Nothing to commit"
          fi
