name: Optimize jubilee website images (one time) # rerun with corrected image
on:
  push:
    paths:
      - .github/workflows/optimize-jubilee-images-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate favicon files and optimize the hero image
        run: |
          python - <<'PY'
          import base64
          import io
          from pathlib import Path
          from PIL import Image
          source = Path(".github/jubilaeumslogo-mini.b64")
          if not source.exists():
              raise SystemExit("Icon source missing; stopping safely")
          logo = Image.open(io.BytesIO(base64.b64decode(source.read_text().strip(), validate=True))).convert("RGB")
          def resized(size):
              return logo.resize((size, size), Image.Resampling.LANCZOS)
          resized(192).save("favicon.png", format="PNG", optimize=True)
          resized(180).save("apple-touch-icon.png", format="PNG", optimize=True)
          resized(256).save("favicon.ico", format="ICO", sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          poster_file = Path("assets/save-the-date-plakat.png")
          if not poster_file.exists():
              raise SystemExit("Hero poster missing; stopping safely")
          with Image.open(poster_file) as poster:
              poster = poster.convert("RGB")
              target = Path("assets/save-the-date-plakat.webp")
              poster.save(target, format="WEBP", quality=89, method=6)
              print("Poster: PNG", poster_file.stat().st_size, "bytes -> WebP", target.stat().st_size, "bytes")
              if target.stat().st_size >= poster_file.stat().st_size:
                  raise SystemExit("Optimized poster not smaller; stopping safely")
          for file in ["index.html", "dorfarchiv.html", "datenschutz.html", "impressum.html"]:
              page = Path(file)
              html = page.read_text(encoding="utf-8")
              old = '<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>'
              replacement = '<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=20261017"/>'
              if old not in html:
                  raise SystemExit("Could not locate expected icon markup in " + file)
              html = html.replace(old, replacement)
              html = html.replace('href="/apple-touch-icon.png"', 'href="/apple-touch-icon.png?v=20261017"')
              if file == "index.html":
                  oldposter = 'src="/assets/save-the-date-plakat.png"'
                  if oldposter not in html:
                      raise SystemExit("Hero poster image link missing")
                  html = html.replace(oldposter, 'src="/assets/save-the-date-plakat.webp"')
              page.write_text(html, encoding="utf-8")
          print("Generated favicon.png, favicon.ico, apple-touch-icon.png, and optimized WebP poster")
          PY
      - name: Commit website asset updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f favicon.svg .github/jubilaeumslogo-mini.b64 .github/workflows/optimize-jubilee-images-once.yml
          git add index.html dorfarchiv.html datenschutz.html impressum.html favicon.png favicon.ico apple-touch-icon.png assets/save-the-date-plakat.webp
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Use Melkendorf jubilee logo for favicons and optimize hero image"
          git push origin HEAD:main
