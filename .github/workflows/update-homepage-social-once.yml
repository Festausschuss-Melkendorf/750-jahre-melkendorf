name: Update homepage social profiles once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-homepage-social-once.yml'

permissions:
  contents: write
  pages: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update social links without rewriting image assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          socials = [
              ('Instagram öffnen', 'https://www.instagram.com/melkendorffeiert/'),
              ('Facebook öffnen', 'https://www.facebook.com/share/1CT2fnmQJu/')
          ]
          for label, url in socials:
              pattern = re.compile(r'<a(?=[^>]*class="footer-app-icon")(?=[^>]*aria-label="' + re.escape(label) + r'")[^>]*>')
              matches = list(pattern.finditer(html))
              if len(matches) != 1:
                  raise ValueError(f'Expected exactly one homepage footer link for {label}, found {len(matches)}')
              tag = matches[0].group(0)
              if tag.count('href="#"') != 1:
                  raise ValueError(f'Unexpected existing footer link for {label}: {tag[:180]}')
              newtag = tag.replace('href="#"', f'href="{url}" rel="noopener noreferrer" target="_blank"')
              html = html[:matches[0].start()] + newtag + html[matches[0].end():]
          path.write_text(html, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-homepage-social-once.yml
          git commit -m "Startseite: offizielle Social-Media-Links aktualisieren"
          git push origin HEAD:main
      - name: Request GitHub Pages build for automated commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/build-result.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "Pages build request HTTP ${code}"
          if [[ "${code}" != "201" && "${code}" != "202" ]]; then
            cat /tmp/build-result.json
            echo "Pages rebuild could not be requested automatically; source commit was applied."
          fi
